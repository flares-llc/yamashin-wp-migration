; Simulates the cheap shared hosting this plugin is designed to survive.
;
; The production test site runs with these limits so that chunk-size
; negotiation, the time budget and cursor resumption are exercised against a
; host that genuinely cuts requests short, rather than only against a
; developer machine where everything happens to fit in one request.

; Requests are killed after 20 seconds. Anything that cannot resume from a
; cursor will fail here, which is the point.
max_execution_time = 20

memory_limit = 128M

; Deliberately below the plugin's 4 MiB ceiling, so a hard-coded chunk size
; would break and the negotiated one must be used.
upload_max_filesize = 2M
post_max_size = 3M

max_input_vars = 1000
